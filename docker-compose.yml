# Infraestructura local de desarrollo: PostgreSQL, Redis y Mailpit (correo de prueba).
# Uso: pnpm dev:infra
services:
  postgres:
    image: postgres:16-alpine
    container_name: rodasoft-postgres
    environment:
      POSTGRES_USER: rodasoft
      POSTGRES_PASSWORD: rodasoft
      POSTGRES_DB: rodasoft
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rodasoft']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rodasoft-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: [redisdata:/data]

  mailpit:
    image: axllent/mailpit:latest
    container_name: rodasoft-mailpit
    ports: ['8025:8025', '1025:1025']

volumes:
  pgdata:
  redisdata:
