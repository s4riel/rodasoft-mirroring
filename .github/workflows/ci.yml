name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rodasoft
          POSTGRES_PASSWORD: rodasoft
          POSTGRES_DB: rodasoft_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rodasoft" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      NX_DAEMON: false
      DATABASE_URL: postgresql://rodasoft:rodasoft@localhost:5432/rodasoft_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-secret-only-for-tests-0123456789
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - name: Migraciones en BD de prueba
        run: pnpm db:deploy
      - run: pnpm nx affected -t lint typecheck test build --parallel=3
