<rs-modal [(open)]="open" variant="form" size="default" heading="Nuevo punto de venta" closeLabel="Cerrar">
  <div class="content">
    <p class="description">Se registra en el SIAT y recibe su propio CUIS. Cada caja de la sucursal factura con este punto de venta. Si el SIAT no responde, no se guarda nada.</p>

    <rs-field label="Sucursal" forId="pos-branch" hint="La sucursal debe estar creada en Configuración." [error]="branchError()" required>
      <rs-select inputId="pos-branch" ariaLabel="Sucursal" placeholder="Elige la sucursal" [invalid]="!!branchError()" [options]="branchOptions()" [value]="branchId()" (valueChange)="setBranch($event)" />
    </rs-field>

    <rs-field label="Nombre del punto de venta" forId="pos-name" hint="Solo para identificarlo en el sistema." [error]="nameError()" required>
      <input rsInput id="pos-name" autocomplete="off" [invalid]="!!nameError()" [value]="name()" (input)="name.set($any($event.target).value)" />
    </rs-field>

    <rs-field label="Tipo de punto de venta" forId="pos-type" [error]="typeError()" required>
      <rs-select inputId="pos-type" ariaLabel="Tipo de punto de venta" placeholder="Elige el tipo" [invalid]="!!typeError()" [options]="typeOptions()" [value]="typeCode()" (valueChange)="typeCode.set($any($event))" />
    </rs-field>

    <rs-field label="Almacén de la caja" forId="pos-warehouse" hint="De aquí sale el stock de las ventas de esta caja." [error]="warehouseError()" required>
      <rs-select inputId="pos-warehouse" ariaLabel="Almacén" placeholder="Elige el almacén" [invalid]="!!warehouseError()" [options]="warehouses()" [value]="warehouseId()" (valueChange)="warehouseId.set($any($event))" />
    </rs-field>

    @if (error(); as message) {
      <rs-note type="danger" title="No pudimos registrar el punto de venta" data-testid="pos-error">{{ message }}</rs-note>
    }
  </div>

  <div slot="footer" class="footer">
    <button rsButton variant="secondary" type="button" [disabled]="saving()" (click)="open.set(false)">Cancelar</button>
    <button rsButton variant="primary" type="button" data-testid="pos-save" [disabled]="saving()" [loading]="saving()" (click)="save()">Registrar en el SIAT</button>
  </div>
</rs-modal>
