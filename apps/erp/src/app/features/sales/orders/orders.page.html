<rs-page-header
  title="Pedidos"
  description="Pedidos con el stock reservado para tus clientes."
  type="list"
  [breadcrumbs]="breadcrumbs"
  breadcrumbLabel="Ruta de navegación"
>
</rs-page-header>

@if (state() === 'forbidden') {
  <section class="state">
    <rs-empty-state-illustrated
      illustration="no-access"
      heading="No tienes permiso para ver los pedidos"
      description="Pide acceso al administrador de tu empresa."
      [showAction]="false"
    />
  </section>
} @else {
  <rs-filter-bar-products
    inline
    searchPlaceholder="Buscar por N.º, cotización o cliente"
    searchLabel="Buscar pedidos"
    clearLabel="Limpiar"
    [clearDisabled]="!hasFilters()"
    [search]="searchText()"
    (searchChange)="onSearch($event)"
    (cleared)="clearAll()"
  >
    <div rsFilters class="filters">
      <rs-select placeholder="Estado" ariaLabel="Estado" [options]="statusOptions" [value]="filters().status" (valueChange)="setStatus($event)" />
    </div>
  </rs-filter-bar-products>

  @switch (state()) {
    @case ('loading') {
      <section class="skeleton" role="status" aria-busy="true" aria-label="Cargando pedidos">
        @for (i of skeletonRows; track i) {
          <div class="skeleton-row">
            <rs-skeleton shape="text" width="10%" height="var(--space-4)" />
            <rs-skeleton shape="text" width="30%" height="var(--space-4)" />
            <rs-skeleton shape="text" width="14%" height="var(--space-4)" />
            <rs-skeleton shape="text" width="10%" height="var(--space-4)" />
          </div>
        }
      </section>
    }
    @case ('error') {
      <section class="state" role="alert">
        <rs-empty-state-illustrated illustration="error" heading="No pudimos cargar los pedidos" [description]="errorMessage()">
          <button rsButton variant="secondary" type="button" (click)="retry()">Reintentar</button>
        </rs-empty-state-illustrated>
      </section>
    }
    @default {
      @if (showEmpty()) {
        <section class="state">
          <rs-empty-state-illustrated
            illustration="no-invoices"
            [showAction]="false"
            heading="Aún no hay pedidos"
            description="Un pedido nace al convertir una cotización y reserva su stock."
          >
          </rs-empty-state-illustrated>
        </section>
      } @else if (showNoResults()) {
        <section class="state">
          <rs-empty-state-illustrated
            illustration="no-results"
            heading="No encontramos pedidos"
            description="Prueba con otros filtros o con otro número."
          >
            <button rsButton variant="secondary" type="button" (click)="clearAll()">Limpiar filtros</button>
          </rs-empty-state-illustrated>
        </section>
      } @else {
        <rs-doc-table size="lg" tableLabel="Pedidos" [columns]="columns" [rows]="rows()">
          <ng-template rsDocCell="number" let-row>
            @if (itemOf(row.id); as item) {
              <a class="number" [routerLink]="['/sales/orders', item.id]">{{ item.number }}</a>
            }
          </ng-template>
          <div slot="footer" class="footer">
            <span class="range">{{ rangeText() }}</span>
            <rs-pagination
              label="Paginación"
              previousLabel="Anterior"
              nextLabel="Siguiente"
              [showLabels]="true"
              [page]="filters().page"
              [pageCount]="pageCount()"
              (pageChange)="goToPage($event)"
            />
          </div>
        </rs-doc-table>
      }
    }
  }
}

<rs-toast-outlet closeLabel="Cerrar" />
