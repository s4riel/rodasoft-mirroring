<rs-page-header
  title="Transferencias"
  description="Mercadería que se mueve entre almacenes y sucursales."
  type="list"
  [breadcrumbs]="breadcrumbs"
  breadcrumbLabel="Ruta de navegación"
>
  <div rsActions class="header-actions">
    <button *rsCan="'inventory.transfers.create'" rsButton variant="brand" type="button" (click)="openNew()">
      <rs-icon name="plus" [size]="16" /> Nueva transferencia
    </button>
  </div>
</rs-page-header>

@if (state() === 'forbidden') {
  <section class="state" role="status">
    <rs-empty-state-illustrated
      illustration="no-access"
      heading="No tienes permiso para ver transferencias"
      description="Pide acceso al administrador de tu empresa."
      [showAction]="false"
    />
  </section>
} @else {
  <rs-filter-bar-products
    searchPlaceholder="Buscar por número, por ejemplo TR-000123"
    searchLabel="Buscar transferencias"
    clearLabel="Limpiar"
    [clearDisabled]="!hasFilters()"
    [search]="searchText()"
    (searchChange)="onSearch($event)"
    (cleared)="clearAll()"
  >
    <div rsFilters class="filters">
      <rs-select
        leadingIcon="check"
        placeholder="Estado"
        ariaLabel="Estado"
        [options]="statusOptions"
        [value]="filters().status"
        (valueChange)="setFilter('status', $event)"
      />
      <rs-select
        leadingIcon="branch"
        placeholder="Origen"
        ariaLabel="Almacén de origen"
        [options]="warehouseOptions()"
        [value]="filters().originWarehouseId"
        (valueChange)="setFilter('originWarehouseId', $event)"
      />
      <rs-select
        leadingIcon="branch"
        placeholder="Destino"
        ariaLabel="Almacén de destino"
        [options]="warehouseOptions()"
        [value]="filters().destinationWarehouseId"
        (valueChange)="setFilter('destinationWarehouseId', $event)"
      />
      <label class="date">
        <span class="date-label">Desde</span>
        <input rsInput type="date" [value]="filters().from ?? ''" (change)="onDate('from', $event)" />
      </label>
      <label class="date">
        <span class="date-label">Hasta</span>
        <input rsInput type="date" [value]="filters().to ?? ''" (change)="onDate('to', $event)" />
      </label>
    </div>
  </rs-filter-bar-products>

  @switch (state()) {
    @case ('loading') {
      <section class="skeleton" role="status" aria-busy="true" aria-label="Cargando transferencias">
        @for (i of skeletonRows; track i) {
          <div class="skeleton-row">
            <rs-skeleton shape="text" width="10%" height="var(--space-4)" />
            <rs-skeleton shape="text" width="26%" height="var(--space-4)" />
            <rs-skeleton shape="text" width="12%" height="var(--space-4)" />
            <rs-skeleton shape="text" width="10%" height="var(--space-4)" />
            <rs-skeleton shape="text" width="10%" height="var(--space-4)" />
          </div>
        }
      </section>
    }
    @case ('error') {
      <section class="state" role="alert">
        <rs-empty-state-illustrated illustration="error" heading="No pudimos cargar las transferencias" [description]="errorMessage()">
          <button rsButton variant="secondary" type="button" (click)="retry()">Reintentar</button>
        </rs-empty-state-illustrated>
      </section>
    }
    @default {
      @if (showEmpty()) {
        <section class="state">
          <rs-empty-state-illustrated
            illustration="empty-transfer"
            heading="Aún no hay transferencias"
            description="Crea la primera para mover mercadería de un almacén a otro."
            [showAction]="canCreate()"
          >
            <button *rsCan="'inventory.transfers.create'" rsButton variant="brand" type="button" (click)="openNew()">
              <rs-icon name="plus" [size]="16" /> Nueva transferencia
            </button>
          </rs-empty-state-illustrated>
        </section>
      } @else if (showNoResults()) {
        <section class="state">
          <rs-empty-state-illustrated
            illustration="no-results"
            heading="No encontramos transferencias"
            description="Prueba con otros filtros o con otro número."
          >
            <button rsButton variant="secondary" type="button" (click)="clearAll()">Limpiar filtros</button>
          </rs-empty-state-illustrated>
        </section>
      } @else {
        <rs-doc-table size="md" tableLabel="Transferencias entre almacenes" [columns]="columns" [rows]="rows()">
          <ng-template rsDocCell="number" let-row>
            @if (itemOf(row.id); as item) {
              <a class="number" [routerLink]="linkOf(item)">{{ item.number }}</a>
            }
          </ng-template>
          <div slot="footer" class="footer">
            <span class="range">{{ range() }}</span>
            <rs-pagination
              label="Paginación"
              previousLabel="Anterior"
              nextLabel="Siguiente"
              [showLabels]="true"
              [page]="filters().page"
              [pageCount]="pageCount()"
              (pageChange)="goToPage($event)"
            />
          </div>
        </rs-doc-table>
      }
    }
  }
}

<rs-toast-outlet closeLabel="Cerrar" />
