<div class="controls">
  <rs-input-group class="search">
    <rs-icon rsInputLeading name="search" [size]="16" />
    <input
      rsInput
      type="search"
      [value]="search()"
      [placeholder]="searchPlaceholder()"
      [attr.aria-label]="searchLabel() || searchPlaceholder()"
      (input)="onSearch($event)"
    />
  </rs-input-group>
  <button type="button" class="clear" (click)="cleared.emit()">{{ clearLabel() }}</button>
</div>
<div class="filters"><ng-content select="[rsFilters]" /></div>
