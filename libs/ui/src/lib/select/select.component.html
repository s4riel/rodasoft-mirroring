<button
  type="button"
  class="control"
  role="combobox"
  aria-haspopup="listbox"
  [attr.id]="inputId()"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="listId"
  [attr.aria-activedescendant]="open() && activeIndex() >= 0 ? optionId(activeIndex()) : null"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [disabled]="isDisabled()"
  (click)="toggle()"
  (keydown)="onKeydown($event)"
  (blur)="onBlur()"
>
  @if (leadingIcon(); as icon) {
    <rs-icon [name]="icon" [size]="16" />
  }
  @if (selectedOption()?.media; as media) {
    @if (media.type === 'flag') {
      <rs-field-media type="flag" [country]="media.country" />
    } @else {
      <rs-field-media type="brand" [text]="media.text" />
    }
  }
  <span class="value" [class.placeholder]="!selectedOption()">{{
    selectedOption()?.label ?? placeholder()
  }}</span>
  <rs-icon class="chevron" name="chevron-down" [size]="16" />
</button>
@if (open()) {
  <ul
    class="menu"
    role="listbox"
    [class.floating]="floating()"
    [style]="floating() ? menuStyle() : null"
    [id]="listId"
    [attr.aria-label]="ariaLabel() || null"
  >
    @for (opt of options(); track $index; let i = $index) {
      <!-- options are driven from the combobox button via aria-activedescendant, so they are not focusable -->
      <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
      <li
        role="option"
        class="option"
        [id]="optionId(i)"
        [class.active]="i === activeIndex()"
        [class.selected]="i === selectedIndex()"
        [class.disabled]="opt.disabled"
        [attr.aria-selected]="i === selectedIndex()"
        [attr.aria-disabled]="opt.disabled ? 'true' : null"
        (mousedown)="$event.preventDefault()"
        (mouseenter)="onHover(i)"
        (click)="choose(i)"
      >
        @if (opt.media; as media) {
          @if (media.type === 'flag') {
            <rs-field-media type="flag" [country]="media.country" />
          } @else {
            <rs-field-media type="brand" [text]="media.text" />
          }
        }
        <span class="label">{{ opt.label }}</span>
        @if (i === selectedIndex()) {
          <rs-icon name="check" [size]="16" />
        }
      </li>
    }
  </ul>
}
