@switch (type()) {
  @case ('flag') {
    <rs-flag [country]="country()" />
  }
  @case ('icon') {
    <ng-content />
  }
  @default {
    @if (type() === 'brand' && logoUrl()) {
      <img class="logo" [src]="logoUrl()" alt="" />
    } @else {
      <span class="text">{{ text() }}</span>
    }
  }
}
