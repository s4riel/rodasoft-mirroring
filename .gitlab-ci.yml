# GitLab CI for Rodasoft (replaces .github/workflows/ci.yml).
# Runs on merge requests and on main. Vercel deploys from GitLab; Railway deploys from the GitHub mirror of main.
# Rule: main is protected and merge requests require a successful pipeline, so only green code reaches the mirror.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - verify

default:
  image: node:22.12-bookworm
  interruptible: true

variables:
  GIT_DEPTH: '0' # Nx "affected" needs the history
  NX_DAEMON: 'false'
  CI: 'true'
  PNPM_HOME: /root/.local/share/pnpm
  # Test database and cache (service hostnames in GitLab CI are the service aliases)
  POSTGRES_USER: rodasoft
  POSTGRES_PASSWORD: rodasoft
  POSTGRES_DB: rodasoft_test
  DATABASE_URL: postgresql://rodasoft:rodasoft@postgres:5432/rodasoft_test?schema=public
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ci-secret-only-for-tests-0123456789

cache:
  key:
    files: [pnpm-lock.yaml]
  paths:
    - .pnpm-store/

check:
  stage: verify
  timeout: 30 minutes
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  before_script:
    # the corepack bundled with node 22.12 has outdated npm signing keys ("Cannot find matching keyid")
    - npm install -g corepack@latest
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    # Base commit for "nx affected": the MR target for merge requests, the previous commit on main.
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        BASE="$CI_COMMIT_BEFORE_SHA"
      else
        BASE="HEAD~1"
      fi
      echo "Nx base: $BASE"
      echo "BASE=$BASE" > nx-base.env
    - pnpm db:deploy
    - . ./nx-base.env && pnpm nx affected -t lint typecheck test build --base="$BASE" --head=HEAD --parallel=3
